<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar Munícipe - Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    #cadastroFormContainer {
      display: none;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Sistema de Munícipes</h2>

    <!-- Buscar Munícipe -->
    <div class="mb-4">
      <h4>Buscar Munícipe</h4>
      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Digite o CPF" id="buscarCpf">
        <button class="btn btn-primary" onclick="buscarMunicipe()">Buscar</button>
      </div>
    </div>

    <!-- Buscar Ordem de Serviço -->
    <div class="mb-5">
      <h4>Buscar Ordem de Serviço</h4>
      <div class="input-group mb-3">
        <select class="form-select" id="buscarOrdem">
          <option value="">Selecione uma categoria</option>
          <option value="GARANTIA-SAFRA">GARANTIA-SAFRA</option>
          <option value="DAP">DAP</option>
          <option value="DOCUMENTAÇÃO">DOCUMENTAÇÃO</option>
          <option value="OUTROS">OUTROS</option>
        </select>
        <button class="btn btn-secondary" onclick="buscarOrdemServico()">Buscar</button>
      </div>
    </div>


    <!-- Modal para exibir os resultados da busca -->
<div class="modal fade" id="modalOrdemServico" tabindex="-1" aria-labelledby="modalOrdemServicoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="modalOrdemServicoLabel">Comentários por Categoria</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="modalOrdemServicoBody">
              <!-- Aqui os resultados da busca serão adicionados -->
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
      </div>
  </div>
</div>

    <!-- Formulário de Cadastro Oculto -->
    <div id="cadastroFormContainer">
      <h4 class="text-center mb-3">Cadastro de Munícipe</h4>
      <form id="cadastroForm" enctype="multipart/form-data">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" name="cpf" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">RG</label>
            <input type="text" class="form-control" name="rg" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">PDF (documento)</label>
            <input type="file" class="form-control" name="pdf" accept="application/pdf" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" name="endereco" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Número</label>
            <input type="text" class="form-control" name="numero" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-control" name="bairro" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" name="cep" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" name="cidade" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <input type="text" class="form-control" name="estado" required>
          </div>
        </div>
        <button type="submit" class="btn btn-success">Cadastrar</button>
      </form>
    </div>

    <!-- Modal Dados do Munícipe -->
    <div id="modalMunicipe" class="modal fade" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Dados do Munícipe</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p><strong>Nome:</strong> <span id="nomeModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('nome')">✎</button></p>
            <p><strong>CPF:</strong> <span id="cpfModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('cpf')">✎</button></p>
            <p><strong>RG:</strong> <span id="rgModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('rg')">✎</button></p>
            <p><strong>Endereço:</strong> <span id="enderecoModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('endereco')">✎</button></p>
            <p><strong>Número:</strong> <span id="numeroModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('numero')">✎</button></p>
            <p><strong>Bairro:</strong> <span id="bairroModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('bairro')">✎</button></p>
            <p><strong>CEP:</strong> <span id="cepModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('cep')">✎</button></p>
            <p><strong>Cidade:</strong> <span id="cidadeModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('cidade')">✎</button></p>
            <p><strong>Estado:</strong> <span id="estadoModal"></span> <button class="btn btn-sm btn-link" onclick="editarCampo('estado')">✎</button></p>

            <a href="#" class="btn btn-outline-primary mb-3" id="btnBaixarPdf" target="_blank">Baixar PDF</a>
            <hr>

            <!-- Comentários -->
            <form id="comentarioForm">
              <div class="mb-3">
                <label for="comentario" class="form-label">Novo Comentário</label>
                <textarea class="form-control" id="comentario" rows="2" required></textarea>
              </div>
              <div class="mb-3">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-select" id="categoria" required>
                  <option value="">Selecione uma categoria</option>
                  <option value="GARANTIA-SAFRA">GARANTIA-SAFRA</option>
                  <option value="DAP">DAP</option>
                  <option value="DOCUMENTAÇÃO">DOCUMENTAÇÃO</option>
                  <option value="OUTROS">OUTROS</option>
                </select>
              </div>
              <button type="submit" class="btn btn-secondary">Salvar Comentário</button>
            </form>

            <div class="mt-4">
              <h6>Histórico de Comentários</h6>
              <ul id="listaComentarios" class="list-group"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
